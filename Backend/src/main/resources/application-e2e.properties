# Banco isolado para os testes e2e
server.port=8081
spring.datasource.hikari.schema=techstore_e2e
spring.jpa.properties.hibernate.default_schema=techstore_e2e
spring.flyway.default-schema=techstore_e2e
spring.flyway.schemas=techstore_e2e
spring.flyway.create-schemas=true
info.app.ambiente=e2e
info.app.schema=${spring.datasource.hikari.schema}
app.cors.allowed-origins=http://localhost:5174,http://127.0.0.1:5174
# Atraso do pagamento nos testes
app.pagamento.atraso-ms=10000
